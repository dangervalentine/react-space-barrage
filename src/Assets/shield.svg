<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <defs>
    <style>
      .shield-main { fill: #7fdbca; }
      .shield-border { fill: none; stroke: #7fdbca; stroke-width: 2; }
      .shield-glow { fill: none; stroke: #7fdbca; stroke-width: 1; opacity: 0.5; }
    </style>
  </defs>

  <!-- Outer glow -->
  <path class="shield-glow" d="M 100 10 Q 150 50 150 120 Q 150 180 100 230 Q 50 180 50 120 Q 50 50 100 10"/>

  <!-- Shield main shape -->
  <path class="shield-main" d="M 100 20 Q 140 55 140 120 Q 140 175 100 220 Q 60 175 60 120 Q 60 55 100 20"/>

  <!-- Shield border -->
  <path class="shield-border" d="M 100 20 Q 140 55 140 120 Q 140 175 100 220 Q 60 175 60 120 Q 60 55 100 20"/>

  <!-- Inner cross pattern (shield symbol) -->
  <g stroke="#7fdbca" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- Vertical line -->
    <line x1="100" y1="50" x2="100" y2="180"/>
    <!-- Horizontal line -->
    <line x1="75" y1="115" x2="125" y2="115"/>
  </g>

  <!-- Decorative corners -->
  <circle cx="75" cy="75" r="3" fill="#7fdbca"/>
  <circle cx="125" cy="75" r="3" fill="#7fdbca"/>
  <circle cx="100" cy="175" r="3" fill="#7fdbca"/>
</svg>
